name: README Doctor
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # `uses: ./` runs the action from this checkout, which is how the composite action is
      # exercised before a release is tagged.
      - uses: ./
        with:
          config: readme-doctor.yml
          format: sarif
          strict: "true"
          output-path: readme-doctor.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: readme-doctor.sarif

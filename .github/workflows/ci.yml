name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Quality on Python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Formatting
        run: ruff format --check .
      - name: Linting
        run: ruff check .
      - name: Static type checking
        run: mypy src
      - name: Tests with coverage
        run: pytest --cov=readme_doctor --cov-report=term-missing
      - name: Confirm the screenshot matches the current output
        # Regenerating must produce no change. A stale screenshot is exactly the drift this
        # project exists to catch.
        run: |
          python scripts/capture_demo.py
          git diff --exit-code -- docs/screenshots/

  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: pytest

  package:
    name: Build and install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install build twine
      - name: Build distributions
        run: python -m build
      - name: Validate package metadata and README rendering
        run: twine check --strict dist/*
      - name: Install the built wheel in a clean environment
        run: |
          python -m venv .package-test
          .package-test/bin/python -m pip install dist/*.whl
      - name: Command line smoke tests
        run: |
          .package-test/bin/readme-doctor --help
          .package-test/bin/readme-doctor rules
          .package-test/bin/python -m readme_doctor --help
      - name: Scan a valid fixture
        run: .package-test/bin/readme-doctor check tests/fixtures/valid_python
      - name: Scan an invalid fixture and expect a failure
        run: |
          if .package-test/bin/readme-doctor check tests/fixtures/terminal_demo; then
            echo "expected a nonzero exit code for the demo fixture"
            exit 1
          fi
      - name: Validate JSON output
        run: |
          .package-test/bin/readme-doctor check tests/fixtures/terminal_demo \
            --format json --output report.json || true
          .package-test/bin/python -c "import json; json.load(open('report.json'))"
      - name: Validate SARIF output
        run: |
          .package-test/bin/readme-doctor check tests/fixtures/terminal_demo \
            --format sarif --output report.sarif || true
          .package-test/bin/python -c "
          import json
          run = json.load(open('report.sarif'))['runs'][0]
          declared = {rule['id'] for rule in run['tool']['driver']['rules']}
          assert declared, 'no rule descriptors'
          for result in run['results']:
              assert result['ruleId'] in declared
              assert result['level'] in {'error', 'warning', 'note', 'none'}
              uri = result['locations'][0]['physicalLocation']['artifactLocation']['uri']
              assert '\\\\' not in uri and not uri.startswith('/')
          print(len(run['results']), 'results validated')
          "

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install pip-audit
      # Auditing the project directory resolves the declared dependency tree. Auditing the installed
      # environment instead would fail on README Doctor itself, which is not published to PyPI.
      - run: pip-audit --strict --progress-spinner off .

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: readme-doctor:test
      - name: Run the image against a fixture
        run: |
          docker run --rm -v "$PWD/tests/fixtures/valid_python:/repository:ro" \
            readme-doctor:test check /repository

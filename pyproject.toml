[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "readme-doctor"
version = "0.1.0"
description = "Check whether repository README instructions still match the project."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Elie El Helou" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Documentation",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "httpx>=0.27,<1",
  "markdown-it-py>=3.0,<5",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.11",
  "pyinstaller>=6.21",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
]

[project.scripts]
readme-doctor = "readme_doctor.cli:app"

[project.urls]
Documentation = "https://github.com/elieh999/readme-doctor#readme"
Issues = "https://github.com/elieh999/readme-doctor/issues"
Source = "https://github.com/elieh999/readme-doctor"

[tool.hatch.build.targets.wheel]
packages = ["src/readme_doctor"]

[tool.hatch.build.targets.sdist]
exclude = [
  "/.git",
  "/.github",
  "/.coverage",
  "/Application",
  "/work",
  "/dist",
  "/.venv",
  "/.package-test",
  "/.pytest_cache",
  "/.mypy_cache",
  "/.ruff_cache",
  # Repository presentation assets are not useful to a package consumer and are large.
  "/docs/assets",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["readme_doctor"]
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
source = ["readme_doctor"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 80
